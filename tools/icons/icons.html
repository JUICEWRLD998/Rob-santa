<!doctype html>
<!--
  Store icons for the game passes and developer products (step 6.1, docs/01 section 10).
  Drawn as SVG in the game's UI style (docs/04 section 5: thick navy outlines, a soft drop shadow,
  Luckiest Guy for numbers, warm light on a navy night). render.mjs screenshots each one to
  art/icons/<id>.png at 512x512. Open icons.html?id=sheet to see them all side by side.
  Pass icons are shown in a circle on the Roblox store, so every subject stays inside the
  central circle (radius ~230).
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Luckiest Guy"; src: url("fonts/LuckiestGuy-Regular.ttf"); }
  @font-face { font-family: "Fredoka One"; src: url("fonts/FredokaOne-Regular.ttf"); }
  html, body { margin: 0; padding: 0; background: #0d1330; }
  svg { display: block; }
  svg * { stroke-linejoin: round; stroke-linecap: round; }
  .num { font-family: "Luckiest Guy"; paint-order: stroke; stroke: #1b1f3b; }
  .sheet { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  .sheet figure { margin: 0; color: #dfe7ff; font: 16px "Fredoka One"; text-align: center; }
  .sheet .round svg { clip-path: circle(50%); }
  .small { display: flex; gap: 12px; padding: 0 16px 16px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/><stop offset=".45" stop-color="#ffc93c"/><stop offset="1" stop-color="#e58a17"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbf3a"/><stop offset="1" stop-color="#c96f0f"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a7a"/><stop offset=".5" stop-color="#e02f40"/><stop offset="1" stop-color="#a3172a"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ef08a"/><stop offset=".5" stop-color="#34b356"/><stop offset="1" stop-color="#1d7a3c"/>
    </linearGradient>
    <linearGradient id="pine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fae62"/><stop offset="1" stop-color="#17663a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8eefff"/><stop offset=".5" stop-color="#2cb8e3"/><stop offset="1" stop-color="#1a78b5"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfdcf7"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e6"/><stop offset="1" stop-color="#f2dcb0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8592ad"/><stop offset=".4" stop-color="#dfe5f2"/><stop offset="1" stop-color="#6d7894"/>
    </linearGradient>
    <linearGradient id="burlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf94"/><stop offset=".55" stop-color="#c38f52"/><stop offset="1" stop-color="#8c5c2f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a4b"/><stop offset="1" stop-color="#7d4a22"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7b3ff"/><stop offset=".5" stop-color="#ad5cf7"/><stop offset="1" stop-color="#6b2bc9"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="3" flood-color="#060a1c" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
</svg>
<div id="root"></div>
<script>
const O = "#1b1f3b"; // outline navy
const SW = 12;       // outline width
const line = `stroke="${O}" stroke-width="${SW}"`;

// Snow dots in the background, fixed so every render is identical.
const SNOW = [[58,70,5],[140,40,3],[220,82,4],[330,46,5],[430,90,3],[470,190,4],[40,210,3],[92,300,4],
  [466,330,5],[34,420,4],[120,470,3],[300,480,4],[420,460,3],[480,40,4],[250,30,3],[170,140,3]];

function background(glow) {
  const id = "bg" + glow.replace("#", "");
  return `
    <defs>
      <radialGradient id="${id}" cx="50%" cy="46%" r="68%">
        <stop offset="0" stop-color="${glow}"/>
        <stop offset=".55" stop-color="#22306a"/>
        <stop offset="1" stop-color="#0d1330"/>
      </radialGradient>
    </defs>
    <rect width="512" height="512" fill="url(#${id})"/>
    <circle cx="256" cy="250" r="150" fill="${glow}" opacity=".35" filter="url(#soft)"/>
    ${SNOW.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity=".55"/>`).join("")}`;
}

function frame(glow, body) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    ${background(glow)}
    <g filter="url(#pop)">${body}</g>
  </svg>`;
}

// A white number with a thick navy outline, Luckiest Guy (the game's number font).
function text(x, y, s, size, fill = "#fff") {
  return `<text class="num" x="${x}" y="${y}" font-size="${size}" text-anchor="middle"
    fill="${fill}" stroke-width="${Math.round(size / 5)}">${s}</text>`;
}

function badge(x, y, s, fill, size = 56) {
  return `<circle cx="${x}" cy="${y}" r="58" fill="url(#${fill})" ${line}/>
    <ellipse cx="${x - 18}" cy="${y - 26}" rx="18" ry="9" fill="#fff" opacity=".45" transform="rotate(-25 ${x - 18} ${y - 26})"/>
    ${text(x, y + size * 0.36, s, size)}`;
}

function sparkle(x, y, r) {
  const k = r * 0.28;
  return `<path d="M${x} ${y - r} Q${x + k} ${y - k} ${x + r} ${y} Q${x + k} ${y + k} ${x} ${y + r}
    Q${x - k} ${y + k} ${x - r} ${y} Q${x - k} ${y - k} ${x} ${y - r} Z" fill="#fff8d0" stroke="${O}" stroke-width="6"/>`;
}

function shine(x, y, rx, ry, angle) {
  return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" opacity=".45" transform="rotate(${angle} ${x} ${y})"/>`;
}

// A present: box, lid, ribbon and bow. (x, y) = top-left of the lid.
function present(x, y, w, h, box, ribbon) {
  const lidH = Math.round(h * 0.28);
  const cx = x + w / 2;
  const rw = Math.round(w * 0.18);
  return `
    <path d="M${cx} ${y + 4} C${cx - w * 0.42} ${y - h * 0.42} ${cx - w * 0.5} ${y - h * 0.05} ${cx - 6} ${y + 2} Z" fill="url(#${ribbon})" ${line}/>
    <path d="M${cx} ${y + 4} C${cx + w * 0.42} ${y - h * 0.42} ${cx + w * 0.5} ${y - h * 0.05} ${cx + 6} ${y + 2} Z" fill="url(#${ribbon})" ${line}/>
    <rect x="${x + w * 0.06}" y="${y + lidH - 6}" width="${w * 0.88}" height="${h - lidH + 6}" rx="12" fill="url(#${box})" ${line}/>
    <rect x="${cx - rw / 2}" y="${y + lidH}" width="${rw}" height="${h - lidH}" fill="url(#${ribbon})" ${line}/>
    <rect x="${x}" y="${y}" width="${w}" height="${lidH}" rx="12" fill="url(#${box})" ${line}/>
    <rect x="${cx - rw / 2}" y="${y}" width="${rw}" height="${lidH}" fill="url(#${ribbon})" ${line}/>
    <circle cx="${cx}" cy="${y + 2}" r="${Math.round(w * 0.09)}" fill="url(#${ribbon})" ${line}/>
    ${shine(x + w * 0.22, y + lidH * 0.45, w * 0.1, lidH * 0.18, -8)}`;
}

// A front-facing coin with a star stamp.
function coin(x, y, r) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 5;
    const rr = i % 2 === 0 ? r * 0.42 : r * 0.18;
    pts.push(`${(x + rr * Math.cos(a)).toFixed(1)},${(y + rr * Math.sin(a)).toFixed(1)}`);
  }
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#gold)" stroke="${O}" stroke-width="${Math.max(8, r * 0.13)}"/>
    <circle cx="${x}" cy="${y}" r="${r * 0.72}" fill="none" stroke="#d98a12" stroke-width="${Math.max(4, r * 0.07)}"/>
    <polygon points="${pts.join(" ")}" fill="#e89a1a"/>
    ${shine(x - r * 0.38, y - r * 0.42, r * 0.22, r * 0.11, -35)}`;
}

// A flat coin seen from the side, for stacks. (x, y) = centre of its top face.
function flatCoin(x, y, rx) {
  const ry = rx * 0.34, t = rx * 0.24;
  return `<path d="M${x - rx} ${y} L${x - rx} ${y + t} A${rx} ${ry} 0 0 0 ${x + rx} ${y + t} L${x + rx} ${y} Z" fill="url(#goldDark)" stroke="${O}" stroke-width="8"/>
    <ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#gold)" stroke="${O}" stroke-width="8"/>
    <ellipse cx="${x}" cy="${y}" rx="${rx * 0.62}" ry="${ry * 0.62}" fill="none" stroke="#d98a12" stroke-width="4"/>`;
}

function stack(x, baseY, count, rx) {
  let s = "";
  const step = rx * 0.24;
  for (let i = 0; i < count; i++) s += flatCoin(x, baseY - i * step, rx);
  return s;
}

const params = new URLSearchParams(location.search);
const id = params.get("id") || "sheet";
const root = document.getElementById("root");
if (id === "sheet") {
  root.innerHTML = `<div class="sheet">${Object.entries(ICONS).map(([key, icon]) =>
    `<figure class="${icon.round ? "round" : ""}">${icon.svg()}<figcaption>${icon.name} (${key})</figcaption></figure>`).join("")}</div>

      `<div style="width:110px;height:110px;overflow:hidden;${icon.round ? "border-radius:50%" : "border-radius:12px"}">
         <div style="transform:scale(${110 / 512});transform-origin:0 0">${icon.svg()}</div></div>`).join("")}</div>`;
} else {
  root.innerHTML = ICONS[id].svg();
}
document.title = Object.keys(ICONS).join(",");
</script>
</body>
